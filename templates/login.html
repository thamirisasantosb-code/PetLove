<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Petlove JM</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6f9;--card:#ffffff;--line:#e2e8f0;--text:#2d3748;--muted:#718096;--accent:#5e2a84;--secondary:#ef4154;}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 'Inter',system-ui,sans-serif; display:flex; align-items:center; justify-content:center;}
    .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 40px; box-shadow: 0 10px 40px rgba(94, 42, 132, 0.08); width: 100%; max-width: 400px; text-align: center; }
    .logos { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .jm-logo { height: 60px; object-fit: contain; }
    h1 { margin: 0 0 10px; font-size: 24px; color: var(--accent); }
    p { margin: 0 0 25px; color: var(--muted); font-size: 14px; }
    form { display: flex; flex-direction: column; gap: 15px; text-align: left; }
    label { font-size: 13px; font-weight: 700; color: var(--text); }
    input { width: 100%; padding: 12px 15px; border: 2px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(94, 42, 132, 0.15); }
    button { border: 0; border-radius: 8px; padding: 14px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .erro { color: var(--secondary); background: #fef2f2; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 15px; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logos">
      <img src="/static/logo-jm.png" alt="JM Distribuição" class="jm-logo" onerror="this.outerHTML='<div style=\'font-weight:900;font-size:36px;color:var(--accent);letter-spacing:-1px;margin:0;\'>JM<span style=\'color:var(--secondary);font-size:20px;\'>TD</span></div>'">
    </div>
    <h1>Portal Petlove</h1>
    <p>Faça login para gerenciar solicitações</p>
    
    {% if erro %}
    <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="POST" id="form-login">
      <label>E-mail
        <input type="email" name="email" required placeholder="seu@email.com" autofocus>
      </label>
      <label>Senha
        <div style="position: relative; margin-top: 5px;">
          <input type="password" name="senha" id="senha" required placeholder="••••••••" style="padding-right: 40px;">
          <span onclick="togglePasswordVisibility('senha', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; user-select: none;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </span>
        </div>
      </label>
      <button type="submit">Entrar no Sistema</button>
      <div style="margin-top:15px; text-align:center; display:flex; flex-direction:column; gap:10px;">
        <a href="javascript:void(0)" onclick="exibirForm('form-solicitar')" style="color:var(--accent); font-size:13px; font-weight:bold; text-decoration:none;">Solicitar novo acesso</a>
        <a href="javascript:void(0)" onclick="exibirForm('form-esqueci')" style="color:var(--muted); font-size:13px; text-decoration:none;">Esqueci minha senha</a>
      </div>
    </form>
    
    <form id="form-solicitar" style="display:none;" onsubmit="solicitarAcesso(event)">
      <p style="color:var(--text); font-weight:bold; margin-bottom:15px;">Informe seu e-mail para criarmos sua conta.</p>
      <label>E-mail Corporativo
        <input type="email" id="email-solicitar" required placeholder="seu@email.com">
      </label>
      <button type="submit" id="btn-solicitar" style="background:#38a169;">Gerar e Enviar Senha</button>
      <div id="status-solicitar" style="margin-top:15px; font-weight:bold; font-size:14px; padding:10px; border-radius:8px; display:none;"></div>
      <div style="margin-top:15px; text-align:center;">
        <a href="javascript:void(0)" onclick="exibirForm('form-login')" style="color:var(--muted); font-size:13px; text-decoration:none;">Voltar para o Login</a>
      </div>
    </form>

    <form id="form-esqueci" style="display:none;" onsubmit="esqueciSenha(event)">
      <p style="color:var(--text); font-weight:bold; margin-bottom:15px;">Informe seu e-mail para recuperar sua senha.</p>
      <label>E-mail Cadastrado
        <input type="email" id="email-esqueci" required placeholder="seu@email.com">
      </label>
      <button type="submit" id="btn-esqueci" style="background:var(--accent);">Recuperar Senha</button>
      <div id="status-esqueci" style="margin-top:15px; font-weight:bold; font-size:14px; padding:10px; border-radius:8px; display:none;"></div>
      <div style="margin-top:15px; text-align:center;">
        <a href="javascript:void(0)" onclick="exibirForm('form-login')" style="color:var(--muted); font-size:13px; text-decoration:none;">Voltar para o Login</a>
      </div>
    </form>
  </div>
  
  <script>
    function toggleForms() {
      exibirForm('form-solicitar');
    }

    function exibirForm(formId) {
      const login = document.getElementById('form-login');
      const solicitar = document.getElementById('form-solicitar');
      const esqueci = document.getElementById('form-esqueci');
      const err = document.querySelector('.erro');
      if (err) err.style.display = 'none';
      
      login.style.display = 'none';
      solicitar.style.display = 'none';
      esqueci.style.display = 'none';
      
      document.getElementById('status-solicitar').style.display = 'none';
      document.getElementById('status-esqueci').style.display = 'none';
      
      if (formId === 'form-login') {
        login.style.display = 'flex';
      } else if (formId === 'form-solicitar') {
        solicitar.style.display = 'flex';
      } else if (formId === 'form-esqueci') {
        esqueci.style.display = 'flex';
      }
    }
    
    async function solicitarAcesso(e) {
      e.preventDefault();
      const email = document.getElementById('email-solicitar').value;
      const btn = document.getElementById('btn-solicitar');
      const status = document.getElementById('status-solicitar');
      
      btn.disabled = true;
      btn.textContent = 'Gerando...';
      status.style.display = 'none';
      
      try {
        const response = await fetch('/api/solicitar-acesso', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: email})
        });
        const data = await response.json();
        
        status.style.display = 'block';
        if (!response.ok) {
          status.style.background = '#fef2f2';
          status.style.color = 'var(--secondary)';
          status.style.border = '1px solid #fecaca';
          status.textContent = data.erro || 'Erro ao solicitar acesso.';
        } else {
          status.style.background = '#f0fff4';
          status.style.color = '#22543d';
          status.style.border = '1px solid #c6f6d5';
          status.innerHTML = `✅ Conta criada com sucesso!<br>Sua senha gerada é: <span style="font-size:18px; color:var(--accent); display:block; margin-top:5px; padding:5px; background:#fff; border-radius:5px; border:1px solid #ccc;">${data.senha}</span> Copie esta senha e faça login!`;
          btn.style.display = 'none';
          document.getElementById('email-solicitar').disabled = true;
        }
      } catch (err) {
        status.style.display = 'block';
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Gerar e Enviar Senha';
      }
    }

    async function esqueciSenha(e) {
      e.preventDefault();
      const email = document.getElementById('email-esqueci').value;
      const btn = document.getElementById('btn-esqueci');
      const status = document.getElementById('status-esqueci');
      
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      status.style.display = 'none';
      
      try {
        const response = await fetch('/api/esqueci-senha', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: email})
        });
        const data = await response.json();
        
        status.style.display = 'block';
        if (!response.ok) {
          status.style.background = '#fef2f2';
          status.style.color = 'var(--secondary)';
          status.style.border = '1px solid #fecaca';
          status.textContent = data.erro || 'Erro ao solicitar recuperação.';
        } else {
          status.style.background = '#f0fff4';
          status.style.color = '#22543d';
          status.style.border = '1px solid #c6f6d5';
          status.innerHTML = `✅ E-mail enviado com sucesso!<br><span style="font-size:13px; display:block; margin-top:5px;">Verifique sua caixa de entrada (ou o console do terminal) para obter o link de confirmação e sua senha temporária.</span>`;
          btn.style.display = 'none';
          document.getElementById('email-esqueci').disabled = true;
        }
      } catch (err) {
        status.style.display = 'block';
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Recuperar Senha';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        `;
      } else {
        input.type = 'password';
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        `;
      }
    }
  </script>
</body>
</html>
